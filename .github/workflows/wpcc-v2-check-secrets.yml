name: WPCC v2 check deploy secrets

# Confirms that the two deploy secrets exist and actually work, without deploying
# anything and without printing a value. Run it from the Actions tab after adding
# or rotating a token. It also runs when this file changes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wpcc-v2-check-secrets.yml"

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_GtKCVCHHn4UDJcZNDnHXaJhQ
  VERCEL_PROJECT_ID: prj_I7NGhW1ZMQrJ7HEO7aU8yCZJXZ7n
  CLOUDFLARE_ACCOUNT_ID: f2af3248ee00346a8154a052c1757de9

jobs:
  vercel:
    name: Vercel token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: VERCEL_TOKEN is set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN is not set"; exit 1; }
          echo "VERCEL_TOKEN is set"

      - name: Token is valid and can see the wpcc-community project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/project.json -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "project lookup: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::The token cannot read the wpcc-community project (HTTP $code). Check its scope."; exit 1; }
          echo "project name: $(python3 -c "import json;print(json.load(open('/tmp/project.json'))['name'])")"

      - name: Token can create deployments for the team
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=1")
          echo "deployments list: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::The token cannot list deployments (HTTP $code)."; exit 1; }

  cloudflare:
    name: Cloudflare token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CLOUDFLARE_API_TOKEN is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          echo "CLOUDFLARE_API_TOKEN is set"

      - name: Token is active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Account-owned tokens verify under the account, user tokens under /user.
          a=$(curl -s -o /tmp/verify.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$a" != "200" ]; then
            u=$(curl -s -o /tmp/verify.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify")
            echo "account verify: HTTP $a, user verify: HTTP $u"
            [ "$u" = "200" ] || { echo "::error::Cloudflare does not accept this token."; exit 1; }
          fi
          echo "token status: $(python3 -c "import json;print(json.load(open('/tmp/verify.json'))['result']['status'])")"

      # The same permissions the media worker deploy needs.
      - name: Can manage Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "workers: HTTP $code"; [ "$code" = "200" ]

      - name: Can manage D1 databases
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          echo "d1: HTTP $code"; [ "$code" = "200" ]

      - name: Can manage R2 buckets
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")
          echo "r2: HTTP $code"; [ "$code" = "200" ]

      - name: Can manage Queues
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")
          echo "queues: HTTP $code"; [ "$code" = "200" ]
