name: WPCC v2 CodeQL

# GitHub's code scanning (CodeQL) looks for security problems such as injection,
# unsafe handling of user input, and leaked secrets in code. CodeQL does not
# support Dart, so this covers the JavaScript and TypeScript parts of wpcc v2:
# the media worker, the browser scripts in web/, and the build tools. The Flutter
# app itself is covered by `flutter analyze` in the CI workflow.
#
# Results appear under the repository's Security tab, Code scanning.
on:
  push:
    branches: [v2]
    paths:
      - "wpcc v2/cloudflare/**"
      - "wpcc v2/web/**"
      - "wpcc v2/tool/**"
      - ".github/workflows/wpcc-v2-codeql.yml"
      - ".github/codeql/**"
  pull_request:
    paths:
      - "wpcc v2/cloudflare/**"
      - "wpcc v2/web/**"
      - "wpcc v2/tool/**"
      - ".github/workflows/wpcc-v2-codeql.yml"
      - ".github/codeql/**"
  schedule:
    # Weekly, Monday 03:00 UTC, so new rules are applied to unchanged code too.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
