flutter:
  uses-material-design: true
  assets:
    - wpcc logo.png
    - assets/google_fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/google_fonts/InstrumentSerif-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/InstrumentSerif-Italic.ttf
          weight: 400
          style: italic
    - family: Instrument Sans
      fonts:
        - asset: assets/google_fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: Urbanist
      fonts:
        - asset: assets/google_fonts/Urbanist.ttf
    - family: PhosphorIconsRegularAppgenz
      fonts:
        - asset: assets/fonts/phosphor-icons-regular-appgenz.ttf
    - family: HugeIconsOutlineAppgenz
      fonts:
        - asset: assets/fonts/huge-icons-outline-appgenz.ttf
    - family: PhosphorIconsBoldAppgenz
      fonts:
        - asset: assets/fonts/phosphor-icons-bold-appgenz.ttf
    - family: PhosphorIconsFillAppgenz
      fonts:
        - asset: assets/fonts/phosphor-icons-fill-appgenz.ttf
    - family: HeroIconsSolidAppgenz
      fonts:
        - asset: assets/fonts/hero-icons-solid-appgenz.ttf
  
