<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WPCC Community">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WPCC Community">
  <meta property="og:title" content="WPCC Community">
  <meta property="og:description" content="Messages, videos, photos and more from Wisdom Power Christian Centre.">
  <meta property="og:image" content="https://my.wisdompowercc.org/icons/Icon-512.png">
  <meta property="og:url" content="https://my.wisdompowercc.org/">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f8f9fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WPCC Community">
  <link rel="manifest" href="manifest.json">
  <title>WPCC Community</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (() => {
      let preference = 'system';
      try {
        const saved = localStorage.getItem('flutter.wpcc.theme') ?? localStorage.getItem('wpcc.theme');
        if (saved) {
          try { preference = JSON.parse(saved); } catch (_) { preference = saved; }
        }
      } catch (_) { /* Use the system theme when storage is unavailable. */ }
      const dark = preference === 'dark' ||
        (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.startupTheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#17131f' : '#f6f7fa';
    })();
  </script>
  <!-- Start the connections the app needs on first load while the HTML is still
       parsing: CanvasKit (gstatic), Supabase, the media catalog API and media
       storage. All are fetched in CORS mode, hence crossorigin. No render-blocking
       third-party stylesheets: the splash uses the system font stack. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.wisdompowercc.org" crossorigin>
  <link rel="preconnect" href="https://media-api.wisdompowercc.org" crossorigin>
  <link rel="preconnect" href="https://storage.wisdompowercc.org" crossorigin>
  <link rel="preload" href="splash-logo.png" as="image" fetchpriority="high">
  <style>
    :root {
      --startup-background: #f6f7fa;
      --startup-ink: #17131f;
      --startup-muted: #5f6475;
      --startup-accent: #8b6cf6;
      --startup-track: #e6e2f1;
      --startup-line: rgba(23, 19, 31, .1);
      --startup-glow: #f1e6fa;
      --startup-surface: #ffffff;
      --startup-backdrop: #f6f5fa;
      color-scheme: light;
    }
    :root[data-startup-theme="dark"] {
      --startup-background: #17131f;
      --startup-ink: #f3edf7;
      --startup-muted: #b9afc6;
      --startup-accent: #8b6cf6;
      --startup-track: #332b40;
      --startup-line: rgba(255, 255, 255, .1);
      --startup-glow: #21172c;
      --startup-surface: #1d1926;
      --startup-backdrop: #131019;
      color-scheme: dark;
    }
    html, body { margin: 0; background: var(--startup-background); }
    #wpcc-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--startup-backdrop);
      color: var(--startup-ink);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      transition: opacity 180ms cubic-bezier(.23, 1, .32, 1);
    }
    :root[data-installed-launch] #wpcc-splash { background: #fff; }
    :root[data-installed-launch] .startup-content > :not(.startup-logo):not(#wpcc-startup-retry) { display: none; }
    :root[data-installed-launch] .startup-logo { width: 45px; height: 45px; padding: 0; margin: 0 auto; box-shadow: none; }
    :root[data-installed-launch] #wpcc-splash[data-error] #wpcc-startup-status { display: block; color: #1c1e24; }
    #wpcc-splash.is-ready { opacity: 0; pointer-events: none; }
    .startup-watermark {
      position: absolute;
      width: 280px;
      right: -40px;
      bottom: 80px;
      opacity: .035;
      pointer-events: none;
    }
    .startup-content { position: relative; width: min(100%, 360px); }
    .startup-logo {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 20px;
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--startup-line), 0 8px 24px rgba(60, 40, 120, .08);
    }
    .startup-logo img { width: 100%; height: 100%; object-fit: contain; }
    .startup-content h1 {
      margin: 0;
      font-family: inherit;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.9px;
      line-height: 1.2;
    }
    #wpcc-startup-status { margin: 12px 0 0; color: var(--startup-muted); font-size: 15px; line-height: 1.5; }
    .startup-progress {
      width: 120px;
      height: 4px;
      margin: 32px auto 0;
      border-radius: 2px;
      overflow: hidden;
      background: var(--startup-track);
    }
    .startup-progress::after {
      content: '';
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: var(--startup-accent);
      animation: startup-progress 1.2s ease-in-out infinite;
    }
    @keyframes startup-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(330%); }
    }
    #wpcc-startup-retry {
      margin-top: 24px;
      min-height: 48px;
      padding: 12px 28px;
      border: 1px solid var(--startup-ink);
      border-radius: 999px;
      background: var(--startup-ink);
      color: var(--startup-surface);
      font: 600 15px system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      cursor: pointer;
      transition: transform 140ms cubic-bezier(.23, 1, .32, 1);
    }
    #wpcc-startup-retry:active { transform: scale(.97); transition-duration: 100ms; }
    #wpcc-startup-retry:focus-visible { outline: 3px solid var(--startup-accent); outline-offset: 4px; }
    #wpcc-splash[data-error] .startup-progress { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #wpcc-splash { transition: none; }
      .startup-progress::after { animation: none; width: 100%; }
      #wpcc-startup-retry { transition: none; }
      #wpcc-startup-retry:active { transform: none; }
    }
    @media (max-height: 360px) {
      .startup-logo { width: 56px; height: 56px; margin-bottom: 12px; border-radius: 16px; }
      .startup-progress { margin-top: 15px; }
    }
  </style>

  <link rel="stylesheet" href="wpcc-install.css">
</head>
<body>
  <main id="wpcc-splash" aria-busy="true" aria-label="WPCC Community startup">
    <div class="startup-content">
      <div class="startup-logo"><img src="splash-logo.png" width="144" height="144" alt="WPCC church logo" fetchpriority="high" decoding="async"></div>
      <h1>WPCC Community</h1>
      <p id="wpcc-startup-status" role="status" aria-live="polite">Loading your community…</p>
      <div class="startup-progress" aria-hidden="true"></div>
      <button id="wpcc-startup-retry" type="button" hidden>Try again</button>
      <noscript><p>Please enable JavaScript to open WPCC Community.</p><style>.startup-progress { display: none; }</style></noscript>
    </div>
  </main>
  <script>
    (() => {
      const splash = document.getElementById('wpcc-splash');
      const status = document.getElementById('wpcc-startup-status');
      const retry = document.getElementById('wpcc-startup-retry');
      let ready = false;
      let timeout;
      retry.addEventListener('click', () => window.location.reload());
      window.wpccShowStartupError = () => {
        if (ready) return;
        clearTimeout(timeout);
        splash.dataset.error = 'true';
        splash.setAttribute('aria-busy', 'false');
        status.textContent = 'Taking longer than expected. Check your connection and try again.';
        retry.hidden = false;
      };
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        clearTimeout(timeout);
        splash.setAttribute('aria-busy', 'false');
        splash.setAttribute('aria-hidden', 'true');
        splash.inert = true;
        splash.classList.add('is-ready');
        const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180;
        setTimeout(() => splash.remove(), delay);
      }, { once: true });
      window.addEventListener('wpcc-startup', () => { timeout = setTimeout(window.wpccShowStartupError, 30000); }, { once: true });
    })();
  </script>

  <div id="wpcc-spotify-player" aria-hidden="true" style="position:fixed;left:-10000px;top:0;width:300px;height:80px;overflow:hidden;pointer-events:none"></div>
  <script src="wpcc-spotify.js"></script>
  <script>
    // The Spotify embed SDK is not needed to paint anything. Load it once the app
    // has shown its first frame and the browser is idle, so it never competes
    // with the app download. wpcc-spotify.js queues any play request until the
    // SDK reports ready, exactly as it did when the SDK loaded at startup.
    window.addEventListener('flutter-first-frame', () => {
      const load = () => {
        const sdk = document.createElement('script');
        sdk.src = 'https://open.spotify.com/embed/iframe-api/v1';
        sdk.async = true;
        document.head.append(sdk);
      };
      if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
      else setTimeout(load, 1500);
    }, { once: true });
  </script>
  <script src="wpcc-push.js"></script>
  <script src="wpcc-device.js"></script>
  <script src="wpcc-install.js"></script>
  <script>
    // Installed launches only (wpcc-install.js sets this synchronously after the
    // device and installation checks pass): begin downloading the app now rather
    // than after flutter_bootstrap.js has been fetched and executed. Browser tabs
    // and desktops never reach this, so the installation gate still decides first.
    if (document.documentElement.dataset.installedLaunch === 'true') {
      const app = document.createElement('link');
      app.rel = 'preload';
      app.as = 'script';
      app.href = 'main.dart.js';
      document.head.append(app);
    }
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.wpccShowStartupError?.()"></script>
</body>
</html>
