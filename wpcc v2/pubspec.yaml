name: wpcc_community
description: WPCC Community Flutter web/PWA.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  # Flutter 3.44 made IconData final. Pin the upstream compatibility fix until
  # phosphor_flutter publishes a release containing it.
  phosphor_flutter:
    git:
      url: https://github.com/hiake21c/flutter.git
      ref: 71f65b6b46ac6493629437d24cf892c0fb9dfe2a
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.3.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2
  file_picker: ^8.3.7
  audioplayers: ^6.1.2
  web: ^1.1.1
  geolocator: ^13.0.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
