<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wisdom Points · Design Review</title>
<link rel="stylesheet" href="department-tools-review.css">
<style>
@font-face{font-family:PointsIcons;src:url('department-tools-icons.ttf');font-display:block}
.icon{font-family:PointsIcons;font-weight:400;font-size:24px;line-height:1}
main{max-width:720px;background:linear-gradient(#39264d,transparent 360px)}
.light main{background:linear-gradient(#ede3f6,transparent 360px)}
header h1{font-size:20px;line-height:26px}h2{font-size:20px;line-height:26px}
.identity{text-align:center;padding:20px 0 32px}.avatar{width:76px;height:76px;border-radius:50%;background:var(--fill);display:grid;place-items:center;margin:auto auto 16px}.avatar .icon{font-size:32px}.identity p{font-size:13px;color:var(--muted);margin:6px 0}
.points-card{width:100%;border-radius:20px;text-align:left;padding:24px;position:relative;background:var(--fill);backdrop-filter:blur(24px);overflow:hidden;box-shadow:inset 0 1px 0 #ffffff14;transition:transform 100ms ease}
.points-card:active{transform:scale(.98)}.points-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.points-top .icon{font-size:18px;color:var(--muted)}
.points-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}.balance{font-size:42px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.balance small{font-size:15px;color:var(--muted);font-weight:400}.badge{width:96px;height:100px;object-fit:contain;filter:drop-shadow(0 6px 12px #0003);flex:none}.points-card p{font-size:13px;line-height:1.5;color:var(--muted);margin:0}.points-footer{display:flex;align-items:center;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.points-footer .icon{font-size:16px;color:var(--good)}
.account-title{font-size:14px;margin:28px 0 10px}.account-row{min-height:60px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);font-size:14px}.account-row .icon{font-size:20px;color:var(--muted)}
dialog{max-width:600px;margin:auto auto 8px;padding:0 24px 28px;max-height:85dvh;overflow:auto;background:var(--sheet)}dialog::backdrop{background:#0008;backdrop-filter:blur(8px)}.handle{width:32px;height:4px;border-radius:4px;background:var(--muted);opacity:.5;margin:12px auto 18px}.sheet-head{display:flex;align-items:center;gap:12px;justify-content:space-between}.sheet-head h2{margin:0}.sheet-head button{width:48px;padding:0;background:var(--fill)}.sheet-award{text-align:center;padding:12px 0 28px}.sheet-award .badge{width:138px;height:146px;animation:award-in 360ms cubic-bezier(.2,.8,.2,1)}.sheet-award .balance{font-size:48px;margin-top:10px}.sheet-award p{font-size:13px;color:var(--muted);margin:8px 0 0}.sheet-history{border-top:1px solid var(--line);padding-top:20px}.sheet-history h3{font-size:16px}.history-row{display:flex;align-items:center;gap:12px;padding:20px 0}.history-row>.icon{color:var(--good)}.history-row .grow{flex:1;min-width:0}.history-row strong{font-size:14px}.history-row small{display:block;font-size:12px;margin-top:6px}.history-row .delta{font-size:15px;color:var(--good);font-weight:600}.empty-history{font-size:14px;color:var(--muted);padding:20px 0}.sheet-note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0}.status-copy{font-size:14px;line-height:1.5;color:var(--muted)}
@keyframes award-in{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@media(min-width:600px){dialog{margin:auto}}@media(prefers-reduced-motion:reduce){.sheet-award .badge{animation:none}.points-card{transition:none}.points-card:active{transform:none}}@media(prefers-reduced-transparency:reduce){.points-card{background:var(--sheet);backdrop-filter:none}dialog::backdrop{backdrop-filter:none}}.solid .points-card{background:var(--sheet);backdrop-filter:none}.large .points-main{flex-wrap:wrap}.large .points-card p,.large .status-copy{font-size:1em}.large .points-top{font-size:1em}@media(forced-colors:active){.points-card{border:1px solid ButtonText}.points-footer .icon,.history-row .delta{color:CanvasText}}
</style>
</head>
<body>
<aside class="preview-controls" aria-label="Review controls"><strong>Design review · Sample points</strong><label><input id="light" type="checkbox">Light</label><label><input id="large" type="checkbox">Large text</label><label><input id="solid" type="checkbox">Reduce transparency</label><label>State<select id="state"><option value="ready">Confirmed</option><option value="pending">Pending</option><option value="empty">Zero points</option><option value="loading">Loading</option><option value="error">Error</option></select></label></aside>
<main><header><h1>My account</h1><span class="icon" aria-hidden="true">&#xe270;</span></header>
<div class="identity"><div class="avatar"><span class="icon" aria-hidden="true">&#xe4c2;</span></div><h2>Sample member</h2><p>Profile design preview</p></div>
<button class="points-card" id="points" aria-haspopup="dialog"><span class="points-top"><span>Wisdom Points</span><span class="icon" aria-hidden="true">&#xe06c;</span></span><span class="points-main"><span class="balance" id="card-balance">105 <small>WP</small></span><img class="badge" src="../assets/images/profile_reward_badge.png" alt=""></span><p id="card-copy">Earned through participation</p><span class="points-footer"><span class="icon" aria-hidden="true">&#xe198;</span><span>View points history</span></span></button>
<h2 class="account-title">Account</h2><div class="account-row"><span class="icon" aria-hidden="true">&#xe4c2;</span>Personal details</div><div class="account-row"><span class="icon" aria-hidden="true">&#xe2fa;</span>Set or change password</div>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="handle"></div><div class="sheet-head"><h2 id="sheet-title">Wisdom Points</h2><button id="refresh" aria-label="Refresh points" title="Refresh points"><span class="icon" aria-hidden="true">&#xe092;</span></button><button id="close" aria-label="Close" title="Close"><span class="icon" aria-hidden="true">&#xe4f6;</span></button></div><div id="sheet-body"></div><p class="sheet-note">Design preview only. No points are awarded or changed.</p></dialog>
<script>
const $=id=>document.getElementById(id);
function updatePoints(){const state=$('state').value;const amount=state==='empty'?0:105;const ready=!['loading','error'].includes(state);const copy=state==='pending'?'Verified activity awaiting points confirmation':state==='loading'?'Loading points':state==='error'?'Points are temporarily unavailable. Please retry.':'Earned through participation';$('card-balance').innerHTML=ready?`${amount} <small>WP</small>`:'&ndash;';$('card-copy').textContent=copy;$('sheet-body').innerHTML=ready?`<section class="sheet-award"><img class="badge" src="../assets/images/profile_reward_badge.png" alt=""><div class="balance">${amount} <small>WP</small></div><p>${copy}</p></section><section class="sheet-history"><h3>Your points history</h3>${amount?'<div class="history-row"><span class="icon" aria-hidden="true">&#xe198;</span><div class="grow"><strong>Sample activity</strong><small>Preview entry · Not a live award</small></div><span class="delta">+105 WP</span></div>':'<p class="empty-history">No points awarded yet</p>'}</section>`:`<p class="status-copy" role="status">${copy}</p>`;}
$('points').onclick=()=>{$('sheet').showModal();};$('close').onclick=()=>$('sheet').close();$('refresh').onclick=()=>{updatePoints();};$('state').onchange=updatePoints;for(const key of ['light','large','solid'])$(key).onchange=event=>document.body.classList.toggle(key,event.target.checked);updatePoints();
</script>
</body>
</html>
