<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02030b">
  <title>WPCC — Points Reward</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ease: cubic-bezier(.22,.72,.18,1);
      --spring: cubic-bezier(.18,1.32,.36,1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    .phone {
      position: relative;
      width: min(100vw, 430px);
      height: min(932px, 100vh);
      min-height: 700px;
      overflow: hidden;
      isolation: isolate;
      background: #02030b;
    }

    @media (min-width: 431px) and (min-height: 780px) {
      .phone {
        border-radius: 46px;
        box-shadow:
          0 35px 90px rgba(0,0,0,.62),
          inset 0 0 0 1px rgba(255,255,255,.045);
      }
    }

    .reward-gradient-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0;
      background:
        radial-gradient(circle at 50% -8%, rgba(70,88,255,.34) 0%, rgba(70,88,255,0) 38%),
        radial-gradient(circle at 50% 25%, rgba(132,63,255,.22) 0%, rgba(132,63,255,0) 34%),
        radial-gradient(circle at 50% 112%, rgba(214,35,139,.12) 0%, rgba(80,165,54,.08) 30%, transparent 58%),
        linear-gradient(180deg, #091451 0%, #05071c 46%, #02030a 100%);
      will-change: opacity, transform, filter;
      animation: rewardBgFade 1.05s var(--ease) both;
    }

    .reward-close {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 12;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      color: #fff;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      opacity: 0;
      transform: scale(.86);
      animation: rewardCloseIn .5s cubic-bezier(.16,1,.3,1) .72s both;
      transition:
        transform .22s var(--ease),
        background .22s ease,
        border-color .22s ease;
    }

    .reward-close span {
      display: block;
      margin-top: -2px;
      font-family: Arial, sans-serif;
      font-size: 28px;
      line-height: 1;
      font-weight: 200;
    }

    .reward-close:hover {
      background: rgba(255,255,255,.13);
      border-color: rgba(255,255,255,.24);
    }

    .reward-close:active {
      transform: scale(.92);
    }

    .reward-stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      animation: rewardStarsFade .75s ease .18s forwards;
    }

    .reward-stars .star {
      position: absolute;
      left: var(--x);
      bottom: -18px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(182,154,255,var(--op));
      box-shadow:
        0 0 7px rgba(148,111,255,.60),
        0 0 14px rgba(88,113,255,.26);
      animation: rewardSpaceRise var(--dur) linear var(--delay) infinite;
      will-change: transform, opacity;
    }

    .reward-stars .star:nth-child(3n) {
      background: rgba(120,229,255,var(--op));
      box-shadow: 0 0 9px rgba(90,215,255,.58);
    }

    .reward-stars .star:nth-child(5n) {
      background: rgba(224,95,255,var(--op));
      box-shadow: 0 0 9px rgba(214,35,139,.45);
    }

    .reward-content {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      padding: 68px 28px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge-showcase {
      position: relative;
      width: 100%;
      min-height: 310px;
      margin-top: 14px;
      display: grid;
      place-items: center;
    }

    .badge-showcase::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle,
          rgba(119,89,255,.26) 0%,
          rgba(214,35,139,.12) 35%,
          rgba(80,165,54,.08) 50%,
          rgba(255,255,255,0) 72%);
      filter: blur(22px);
      animation:
        rewardHaloIn 1.1s ease .52s both,
        rewardHaloPulse 4.4s ease-in-out 1.62s infinite;
    }

    .badge-image {
      position: relative;
      z-index: 2;
      width: 212px;
      height: 212px;
      object-fit: contain;
      display: block;
      opacity: 0;
      transform: translate3d(0,-26px,0) scale(.46) rotate(-8deg);
      filter:
        drop-shadow(0 24px 36px rgba(0,0,0,.42))
        drop-shadow(0 0 22px rgba(76,237,233,.16))
        drop-shadow(0 0 24px rgba(214,35,139,.16));
      will-change: transform, opacity, filter;
      animation:
        rewardBadgeBounceIn 1.08s var(--spring) .48s both,
        rewardBadgeFloat 4.8s cubic-bezier(.45,.05,.55,.95) 1.62s infinite;
    }

    .reward-copy {
      margin-top: 0;
      text-align: center;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(18px);
      animation: rewardTextIn .76s cubic-bezier(.16,1,.3,1) 1.02s both;
    }

    .reward-kicker {
      margin: 0 0 9px;
      font-size: 12px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: .015em;
      color: rgba(255,255,255,.68);
    }

    .reward-copy h1 {
      max-width: 350px;
      margin: 0 auto;
      font-family: "Manrope", sans-serif;
      font-size: 31px;
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: -.05em;
    }

    .reward-summary {
      margin: 13px auto 0;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 300;
      color: rgba(255,255,255,.70);
    }

    .reward-bottom-copy {
      width: 100%;
      margin-top: auto;
      padding-top: 24px;
      text-align: center;
      opacity: 0;
      filter: blur(7px);
      transform: translateY(18px);
      animation: rewardBottomIn .74s cubic-bezier(.16,1,.3,1) 1.30s both;
    }

    .reward-bottom-copy p {
      max-width: 330px;
      margin: 0 auto;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: -.015em;
      color: rgba(255,255,255,.86);
    }

    .learn-more {
      display: inline;
      margin: 0 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.97);
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition:
        opacity .2s ease,
        transform .2s var(--ease);
    }

    .learn-more:active {
      transform: scale(.97);
    }

    @keyframes rewardBgFade {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: scale(1.035);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    @keyframes rewardStarsFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes rewardSpaceRise {
      0% {
        transform: translate3d(0,0,0) scale(.7);
        opacity: 0;
      }
      10% {
        opacity: var(--op);
      }
      82% {
        opacity: calc(var(--op) * .9);
      }
      100% {
        transform: translate3d(0,-112vh,0) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes rewardBadgeBounceIn {
      0% {
        opacity: 0;
        transform: translate3d(0,-28px,0) scale(.46) rotate(-8deg);
        filter: blur(10px) drop-shadow(0 20px 32px rgba(0,0,0,.34));
      }
      56% {
        opacity: 1;
        transform: translate3d(0,8px,0) scale(1.08) rotate(2deg);
        filter: blur(0) drop-shadow(0 24px 36px rgba(0,0,0,.42));
      }
      76% {
        transform: translate3d(0,-5px,0) scale(.985) rotate(-1deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(0,0,0) scale(1) rotate(0deg);
        filter:
          drop-shadow(0 24px 36px rgba(0,0,0,.42))
          drop-shadow(0 0 22px rgba(76,237,233,.16))
          drop-shadow(0 0 24px rgba(214,35,139,.16));
      }
    }

    @keyframes rewardBadgeFloat {
      0%   { transform: translate3d(0,0,0) rotate(-1deg) scale(1); }
      25%  { transform: translate3d(0,-6px,0) rotate(.8deg) scale(1.008); }
      50%  { transform: translate3d(0,-11px,0) rotate(-.6deg) scale(1.012); }
      75%  { transform: translate3d(0,-5px,0) rotate(.7deg) scale(1.007); }
      100% { transform: translate3d(0,0,0) rotate(-1deg) scale(1); }
    }

    @keyframes rewardHaloIn {
      from { opacity: 0; transform: scale(.78); }
      to { opacity: .9; transform: scale(1); }
    }

    @keyframes rewardHaloPulse {
      0%,100% { opacity: .72; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes rewardTextIn {
      from {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes rewardBottomIn {
      from {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes rewardCloseIn {
      from {
        opacity: 0;
        filter: blur(4px);
        transform: scale(.82);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    @media (max-height: 780px) {
      .reward-content {
        padding: 62px 24px 26px;
      }

      .badge-showcase {
        min-height: 246px;
        margin-top: 0;
      }

      .badge-image {
        width: 176px;
        height: 176px;
      }

      .reward-copy h1 {
        font-size: 28px;
      }

      .reward-bottom-copy p {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reward-gradient-layer,
      .reward-close,
      .reward-stars,
      .badge-image,
      .badge-showcase::before,
      .reward-copy,
      .reward-bottom-copy,
      .reward-stars .star {
        animation: none !important;
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }

      .reward-stars {
        display: none;
      }
    }
  </style>
</head>

      <div class="reward-copy">
        <h1>+15WP</h1>
        <p class="reward-summary">You've been awarded 15WP for completing your profile.</p>
      </div>

      <div class="reward-bottom-copy">
        <p>
          Earn points by engaging and participating in activities on the app
          <button class="learn-more" type="button">Learn more</button>

        </p>

  </main>

  <script>
    const stars = document.getElementById('rewardStars');

    for (let i = 1; i <= 28; i++) {
      const dot = document.createElement('span');
      dot.className = 'star';

      const x = (i * 37) % 94 + 3;
      const sizes = [2, 3, 4, 5];
      const size = sizes[i % sizes.length];
      const duration = 7.5 + (i % 6) * 1.15;
      const delay = -((i * 1.37) % 9.5);
      const opacity = 0.28 + (i % 5) * 0.12;

      dot.style.setProperty('--x', `${x}%`);
      dot.style.setProperty('--size', `${size}px`);
      dot.style.setProperty('--dur', `${duration.toFixed(2)}s`);
      dot.style.setProperty('--delay', `${delay.toFixed(2)}s`);
      dot.style.setProperty('--op', opacity.toFixed(2));

      stars.appendChild(dot);
    }

    document.getElementById('rewardClose').addEventListener('click', () => {
      const screen = document.getElementById('rewardScreen');
      screen.animate(
        [
          { opacity: 1, transform: 'scale(1)', filter: 'blur(0)' },
          { opacity: 0, transform: 'scale(.985)', filter: 'blur(6px)' }
        ],
        {
          duration: 380,
          easing: 'cubic-bezier(.22,.72,.18,1)',
          fill: 'forwards'
        }
      );
    });
  </script>
